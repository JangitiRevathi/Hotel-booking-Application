spring.application.name=Hotel_booking_System

# MySQL Database Configuration
# Use environment variables for sensitive info in public repos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking_db}
spring.datasource.username=root
spring.datasource.password=root123

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security API Config
letsgo.app.jwtSecret=${JWT_SECRET:letsgo_default_secret_key_123456789_at_least_32_chars}
letsgo.app.jwtExpirationMs=86400000

